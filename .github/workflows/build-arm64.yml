name: Build ARM64 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant (release / debug)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-arm64:
    name: Assemble ARM64-v8a APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "27.0.12077973"
      ANDROID_CMAKE_VERSION: "3.22.1"
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK 27 & CMake 3.22.1
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional release keystore
        env:
          GGNEXT_KEYSTORE_BASE64: ${{ secrets.GGNEXT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${GGNEXT_KEYSTORE_BASE64}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/ggnext-release.keystore"
            printf '%s' "${GGNEXT_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "GGNEXT_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
            echo "Using release keystore from GitHub Secrets."
          else
            echo "No GGNEXT_KEYSTORE_BASE64 secret configured; release build will fall back to debug signing."
          fi

      - name: Build ARM64-v8a APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          GGNEXT_KEYSTORE_PASSWORD: ${{ secrets.GGNEXT_KEYSTORE_PASSWORD }}
          GGNEXT_KEY_ALIAS: ${{ secrets.GGNEXT_KEY_ALIAS }}
          GGNEXT_KEY_PASSWORD: ${{ secrets.GGNEXT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${BUILD_TYPE}" = "debug" ]; then
            TASK=":app:assembleDebug"
          else
            TASK=":app:assembleRelease"
          fi
          ./gradlew "${TASK}" \
            -PabiFilters=arm64-v8a \
            -PndkVersion="${ANDROID_NDK_VERSION}" \
            --no-daemon \
            --stacktrace

      - name: Package & verify ARM64-only APK
        id: package
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "${VERSION_NAME}" ] || VERSION_NAME="unknown"

          APK_SRC=$(find "app/build/outputs/apk/${BUILD_TYPE}" -maxdepth 2 -type f -name "*.apk" | head -n1)
          if [ -z "${APK_SRC}" ] || [ ! -f "${APK_SRC}" ]; then
            echo "ERROR: Built APK not found under app/build/outputs/apk/${BUILD_TYPE}"
            exit 1
          fi

          mkdir -p dist-apk
          APK_NAME="GGNext-v${VERSION_NAME}-arm64-v8a-${BUILD_TYPE}.apk"
          APK_OUT="dist-apk/${APK_NAME}"
          cp "${APK_SRC}" "${APK_OUT}"

          echo "Built APK: ${APK_OUT} ($(du -h "${APK_OUT}" | cut -f1))"
          echo "Packaged native libraries:"
          unzip -l "${APK_OUT}" 'lib/*' || true

          # Sanity check: ensure no non-arm64 ABIs were bundled
          if unzip -l "${APK_OUT}" 'lib/*' | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "ERROR: Unexpected non-arm64-v8a ABI detected in APK!"
            exit 1
          fi

          echo "apk_path=${APK_OUT}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGNext-v${{ steps.package.outputs.version_name }}-arm64-v8a-${{ github.event.inputs.build_type || 'release' }}
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.apk_path }}
          generate_release_notes: true
