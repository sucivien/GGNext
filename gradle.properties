# JVM / Gradle
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 仅本构建机需要：这台机器是 aarch64，而 AGP 自带的 aapt2 是 x86-64 ELF，
# 因此用 qemu-x86_64-static 包装脚本替代（见交付文档「构建环境」一节）。
# 在 x86-64 / macOS / 正常 Android Studio 环境下，请删除或注释掉下面这行。
# ---------------------------------------------------------------------------
# android.aapt2FromMavenOverride=/workspace/tools/aapt2
